name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            name: Darwin-arm64
          - os: ubuntu-latest
            arch: x86_64
            name: Linux-x86_64
          - os: windows-latest
            arch: x86_64
            name: Windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow 'open-clip-torch>=2.20.0' 'torch>=2.0.0' flask flask-cors tqdm

      - name: Download model
        run: |
          python -c "
          import open_clip
          import os
          os.environ['HF_ENDPOINT'] = 'https://hf-mirror.com'
          model, _, preprocess = open_clip.create_model_and_transforms('ViT-B-32', pretrained='laion2b_s34b_b79k')
          print('Model cached successfully')
          "

      - name: Build with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --clean --noconfirm \
            --name imgsearch-minimal \
            --add-data "web:web" \
            --hidden-import open_clip \
            --hidden-import torch \
            --hidden-import torchvision \
            --hidden-import PIL \
            --hidden-import flask \
            --hidden-import flask_cors \
            --collect-all open_clip \
            --collect-all torch \
            --collect-all torchvision \
            app.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --noconfirm `
            --name imgsearch-minimal `
            --add-data "web;web" `
            --hidden-import open_clip `
            --hidden-import torch `
            --hidden-import torchvision `
            --hidden-import PIL `
            --hidden-import flask `
            --hidden-import flask_cors `
            --collect-all open_clip `
            --collect-all torch `
            --collect-all torchvision `
            app.py

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          mv imgsearch-minimal imgsearch-minimal-${{ matrix.name }}
          echo "#!/bin/bash" > imgsearch-minimal-${{ matrix.name }}/run.sh
          echo 'cd "$(dirname "$0")"' >> imgsearch-minimal-${{ matrix.name }}/run.sh
          echo "./imgsearch-minimal" >> imgsearch-minimal-${{ matrix.name }}/run.sh
          chmod +x imgsearch-minimal-${{ matrix.name }}/run.sh
          tar -czf imgsearch-minimal-${{ matrix.name }}.tar.gz imgsearch-minimal-${{ matrix.name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Rename-Item imgsearch-minimal imgsearch-minimal-${{ matrix.name }}
          Compress-Archive -Path imgsearch-minimal-${{ matrix.name }} -DestinationPath imgsearch-minimal-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgsearch-minimal-${{ matrix.name }}
          path: dist/imgsearch-minimal-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
